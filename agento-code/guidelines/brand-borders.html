<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.b{border-radius:var(--radius);padding:14px;background:var(--raised);min-height:74px}.n{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-soft);display:block;margin-top:6px}.t{font-family:var(--font-mono);font-size:11px;font-weight:700}</style></head><body>
<div class="b" style="border:var(--bw) solid var(--ink)"><span class="t">--bw 1.5px</span><span class="n">sheets, rows, tables</span></div>
<div class="b" style="border:var(--bw-strong) solid var(--ink)"><span class="t">--bw-strong 2px</span><span class="n">masthead, buttons, feature</span></div>
<div class="b" style="border:var(--bw) dashed var(--ink);background:transparent"><span class="t">dashed 1.5px</span><span class="n">provisional surface, notes</span></div>
<div class="b" style="border:var(--bw-hair) solid var(--ink-faint)"><span class="t">1px ink-faint</span><span class="n">interior row + cell rules</span></div>
</body></html>
