<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center}.sw{border:var(--bw) solid var(--ink);border-radius:var(--radius);overflow:hidden}.chip{height:58px;border-bottom:var(--bw) solid var(--ink);background:var(--warn)}.m{padding:8px 10px;background:var(--raised)}.n{font-family:var(--font-mono);font-size:11px;font-weight:700}.v{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft)}.note{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 16px;border:var(--bw) solid var(--warn);border-radius:var(--radius)}.k{font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}.b{font-size:14.5px;color:var(--ink-soft);margin:0}</style></head><body>
<div class="sw"><div class="chip"></div><div class="m"><div class="n">--warn</div><div class="v">#E8A33D</div></div></div>
<div class="note"><span class="k">Careful</span><p class="b">There is no success green and no danger red. Do not invent a status palette — say it in words instead.</p></div>
</body></html>
