<!-- @dsCard group="Colors" viewport="700x150" name="Grounds" subtitle="Bone paper, raised sheets, sunken insets" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sw{border:var(--bw) solid var(--ink);border-radius:var(--radius);overflow:hidden}.chip{height:60px;border-bottom:var(--bw) solid var(--ink)}.m{padding:8px 10px;background:var(--raised)}.n{font-family:var(--font-mono);font-size:11px;font-weight:700}.v{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft)}</style></head><body>
<div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="m"><div class="n">--paper</div><div class="v">#F0EEE6 · page</div></div></div>
<div class="sw"><div class="chip" style="background:var(--raised)"></div><div class="m"><div class="n">--raised</div><div class="v">#F7F5EE · sheets, cards</div></div></div>
<div class="sw"><div class="chip" style="background:var(--sunken)"></div><div class="m"><div class="n">--sunken</div><div class="v">#E6E3D9 · insets, hover</div></div></div>
</body></html>
