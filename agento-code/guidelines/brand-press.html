<!-- @dsCard group="Brand" viewport="700x180" name="Press behaviour" subtitle="Hover translates 2px onto the shadow; press lands on it" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:26px 30px;display:flex;gap:40px;align-items:flex-start}.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:var(--bw-strong) solid var(--ink);border-radius:var(--radius);background:var(--accent);color:var(--on-accent);font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.s1{box-shadow:5px 5px 0 var(--ink)}.s2{box-shadow:2px 2px 0 var(--ink);transform:translate(2px,2px)}.s3{box-shadow:0 0 0 var(--ink);transform:translate(4px,4px)}.f{outline:3px solid var(--accent);outline-offset:3px;background:var(--raised);color:var(--ink)}.c{display:flex;flex-direction:column;gap:14px;align-items:flex-start}.n{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}</style></head><body>
<div class="c"><span class="btn s1">Rest</span><span class="n">5px 5px 0</span></div>
<div class="c"><span class="btn s2">Hover</span><span class="n">translate 2px · 2px 2px 0</span></div>
<div class="c"><span class="btn s3">Press</span><span class="n">translate 4px · 0 0 0</span></div>
<div class="c"><span class="btn f s1">Focus</span><span class="n">3px accent, 3px offset</span></div>
</body></html>
