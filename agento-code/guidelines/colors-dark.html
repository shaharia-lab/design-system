<!-- @dsCard group="Colors" viewport="700x180" name="Dark inversion" subtitle="Ground and ink swap; the accent is re-tuned, not flipped" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--paper)}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.sw{border:var(--bw) solid var(--ink);border-radius:var(--radius);overflow:hidden}.chip{height:44px;border-bottom:var(--bw) solid var(--ink)}.m{padding:6px 8px;background:var(--raised)}.n{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--ink)}.sheet{background:var(--raised);border:var(--bw) solid var(--ink);border-radius:var(--radius);box-shadow:var(--offset);padding:16px 18px}.h{font-family:var(--font-sub);font-weight:600;font-size:19px;margin:0 0 6px;color:var(--ink)}.p{margin:0;font-size:14px;color:var(--ink-soft)}</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="m"><div class="n">--paper</div></div></div>
<div class="sw"><div class="chip" style="background:var(--raised)"></div><div class="m"><div class="n">--raised</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="m"><div class="n">--ink</div></div></div>
<div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="m"><div class="n">--accent</div></div></div>
<div class="sw"><div class="chip" style="background:var(--accent-tint)"></div><div class="m"><div class="n">--accent-tint</div></div></div>
</div>
<div class="sheet"><h3 class="h">The shadow becomes bone</h3><p class="p">Borders, offsets, radii, type and spacing are unchanged — <code style="font-family:var(--font-mono);font-size:12px">--offset</code> reads <code style="font-family:var(--font-mono);font-size:12px">8px 8px 0 var(--ink)</code> in both themes.</p></div>
</body></html>
