<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px 30px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}.b{background:var(--raised);border:var(--bw) solid var(--ink);border-radius:var(--radius);padding:16px}.n{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-soft)}.t{font-family:var(--font-sub);font-weight:600;font-size:17px;margin:0 0 6px}</style></head><body>
<div class="b" style="box-shadow:var(--offset)"><p class="t">--offset</p><span class="n">8px 8px 0 var(--ink)<br>sheets, panels, stats</span></div>
<div class="b" style="box-shadow:var(--offset-sm)"><p class="t">--offset-sm</p><span class="n">5px 5px 0 var(--ink)<br>buttons, the closer</span></div>
<div class="b" style="box-shadow:var(--offset-accent)"><p class="t">--offset-accent</p><span class="n">8px 8px 0 var(--accent)<br>recommended install card</span></div>
</body></html>
