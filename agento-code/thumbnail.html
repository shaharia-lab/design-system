<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>html,body{margin:0}.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px}.main{background:#F0EEE6;display:grid;place-items:center;border-right:10px solid #0B0C07}.mark{display:flex;align-items:center;gap:34px}.dot{width:120px;height:120px;border-radius:999px;background:#1F7A4C;border:10px solid #0B0C07}.name{font-family:"Instrument Serif",Georgia,serif;font-size:186px;line-height:1;color:#0B0C07}.strip{display:grid;grid-template-rows:repeat(3,1fr)}</style></head><body><div class="tile"><div class="main"><div class="mark"><span class="dot"></span><span class="name">Agento</span></div></div><div class="strip"><div style="background:#CDE6D8"></div><div style="background:#1F7A4C"></div><div style="background:#125C39"></div></div></div></body></html>
