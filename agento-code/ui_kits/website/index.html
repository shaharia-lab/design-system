<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { Masthead, Footer } = window.AgentoDesignSystem_36a6ee;
const SITE_REPO = 'https://github.com/shaharia-lab/agento';

function Site() {
  const [view, setView] = React.useState('Home');
  const [theme, setTheme] = React.useState('light');
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    window.scrollTo(0, 0);
  }, [theme, view]);
  const go = (v) => setView(v);
  return <>
    <Masthead
      current={view === 'Blog' || view === 'Post' ? 'Blog' : undefined}
      links={[
        { label: 'Docs', href: '../docs/index.html' },
        { label: 'Blog', href: '#', onClick: (e) => { e.preventDefault(); setView('Blog'); } },
        { label: 'Releases', href: SITE_REPO + '/releases' },
      ]}
      star={{ href: SITE_REPO }}
      theme={theme === 'dark' ? 'Light' : 'Dark'}
      onTheme={() => setTheme(theme === 'dark' ? 'light' : 'dark')} />
    {view === 'Home' ? <Landing go={go} /> : null}
    {view === 'Blog' ? <BlogIndex go={setView} /> : null}
    {view === 'Post' ? <BlogPost /> : null}
    {view === '404' ? <NotFound go={setView} /> : null}
    {view === 'Security' ? <SecurityPage /> : null}
    <div className="shell">
      <Footer copyright="© 2026 Shaharia Lab · MIT"
        links={[
          { label: 'Docs', href: '../docs/index.html' },
          { label: 'Blog', href: '#', onClick: (e) => { e.preventDefault(); setView('Blog'); } },
          { label: 'Releases', href: SITE_REPO + '/releases' },
          { label: 'Security', href: '#', onClick: (e) => { e.preventDefault(); setView('Security'); } },
          { label: '404', href: '#', onClick: (e) => { e.preventDefault(); setView('404'); } },
        ]}
        aside="runs entirely on your machine —" />
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
</script></body></html>
